<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLIPIT — Desktop and Mobile Preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f2f1ff;font:14px system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid #2e3954}h1{font-size:20px;margin:0}header a{color:#b9a8ff}.controls{display:flex;justify-content:center;align-items:center;gap:10px;padding:18px;flex-wrap:wrap}button{background:#243048;border:1px solid #485779;color:white;border-radius:10px;padding:10px 18px;cursor:pointer}button[aria-pressed=true]{background:#a897ff;color:#151029}p{color:#aebad1;text-align:center;margin:0 16px 14px}.viewport{margin:0 auto 32px;border:6px solid #313c59;border-radius:17px;overflow:hidden;background:white;max-width:calc(100vw - 22px)}iframe{display:block;width:100%;height:100%;border:0}.viewport.mobile{width:390px;height:780px}.viewport.desktop{width:calc(100vw - 60px);height:calc(100vh - 172px);min-height:600px;max-width:1500px}footer{text-align:center;padding-bottom:25px;color:#95a2bd}</style></head><body><header><h1>CLIPIT AI — Interface previews</h1><a href="./">Open full app</a></header><div class="controls"><button id="desktop" aria-pressed="true">Desktop preview</button><button id="mobile" aria-pressed="false">Mobile preview</button></div><p id="notice">Desktop layout at browser width. Preview is for checking layout; sign-in and file processing should be tested in the full app.</p><div id="viewport" class="viewport desktop"><iframe id="app" src="./?preview=desktop" title="CLIPIT desktop preview"></iframe></div><footer>Both previews share the same website and GitHub repository.</footer><script>const area=document.getElementById('viewport');const frame=document.getElementById('app');for(const mode of ['desktop','mobile'])document.getElementById(mode).onclick=()=>{area.className='viewport '+mode;frame.src='./?preview='+mode;document.getElementById('desktop').setAttribute('aria-pressed',String(mode==='desktop'));document.getElementById('mobile').setAttribute('aria-pressed',String(mode==='mobile'));};</script></body></html>
